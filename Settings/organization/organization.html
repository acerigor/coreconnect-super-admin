<link rel="stylesheet" href="../../shared/app.css?v=2">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);margin:0;padding:0;font-family:'DM Sans',sans-serif;}

  /* TOP HEADER (full width, contains logo) */
  .top-header{position:fixed;top:0;left:0;right:0;height:64px;
    background:var(--bg);border-bottom:0.5px solid var(--brd);
    display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:60;}
  .top-header .logo{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.3px;
    color:var(--tx);display:flex;align-items:center;gap:10px;}
  .top-header .logo-mark{width:32px;height:32px;display:flex;
    align-items:center;justify-content:center;flex-shrink:0;}
  .top-header .logo-mark img{width:32px;height:32px;border-radius:8px;object-fit:cover;}

  /* Top-header right actions (notifications bell, etc.) */
  .top-header-right{display:flex;align-items:center;gap:10px;}
  .header-bell{position:relative;width:40px;height:40px;display:flex;align-items:center;
    justify-content:center;border-radius:10px;cursor:pointer;color:var(--mu);
    transition:all .12s;background:transparent;border:none;}
  .header-bell:hover{background:var(--hover);color:var(--tx);}
  .header-bell.active{background:rgba(79,124,255,.10);color:var(--ac2);}
  .header-bell-dot{position:absolute;top:9px;right:9px;width:8px;height:8px;
    border-radius:50%;background:var(--rd);border:2px solid var(--bg);
    display:none;}
  .header-bell-dot.show{display:block;}
  .header-bell::after{content:attr(data-label);position:absolute;top:48px;left:50%;
    transform:translateX(-50%);background:var(--sur2);color:var(--ac2);
    font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;
    border:0.5px solid var(--ac);white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .12s;z-index:100;}
  .header-bell:hover::after{opacity:1;}

  /* NOTIFICATIONS PANEL */
  .notif-panel{display:none;position:fixed;top:0;left:0;width:420px;max-height:560px;
    background:var(--sur);border:0.5px solid var(--brd2);border-radius:12px;
    box-shadow:0 12px 36px rgba(0,0,0,.55);z-index:9999;
    flex-direction:column;overflow:hidden;}
  .notif-panel.open{display:flex;}

  .notif-header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
  .notif-title{font-size:14px;font-weight:600;color:var(--tx);}
  .notif-header-actions{display:flex;align-items:center;gap:6px;}
  .notif-markall{background:transparent;border:none;color:var(--ac2);
    font-size:12px;font-weight:500;font-family:var(--font);cursor:pointer;
    padding:4px 8px;border-radius:6px;transition:background .12s;}
  .notif-markall:hover{background:rgba(79,124,255,.10);}
  .notif-markall[disabled]{opacity:.4;cursor:not-allowed;}
  .notif-markall[disabled]:hover{background:transparent;}
  .notif-close{display:none;width:36px;height:36px;border-radius:8px;
    background:transparent;border:none;color:var(--mu);cursor:pointer;
    align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;}
  .notif-close:hover{background:var(--hover);color:var(--tx);}

  .notif-tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:0.5px solid var(--brd);flex-shrink:0;}
  .notif-tab{background:transparent;border:none;color:var(--mu);
    font-size:12.5px;font-weight:500;font-family:var(--font);cursor:pointer;
    padding:8px 12px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:6px;
    border-bottom:2px solid transparent;margin-bottom:-0.5px;transition:color .12s;}
  .notif-tab:hover{color:var(--tx);}
  .notif-tab.active{color:var(--ac2);border-bottom-color:var(--ac);}
  .notif-tab-count{font-family:var(--mono);font-size:10.5px;color:var(--mu);
    background:var(--sur2);padding:1px 6px;border-radius:9px;min-width:18px;
    text-align:center;}
  .notif-tab.active .notif-tab-count{color:var(--ac2);background:rgba(79,124,255,.16);}

  .notif-body{overflow-y:auto;flex:1;min-height:120px;
    scrollbar-width:thin;scrollbar-color:var(--brd2) transparent;}
  .notif-body::-webkit-scrollbar{width:6px;}
  .notif-body::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px;}
  .notif-body::-webkit-scrollbar-thumb:hover{background:var(--mu);}

  .notif-empty{padding:40px 20px;text-align:center;color:var(--mu);font-size:12.5px;}
  .notif-empty-icon{font-size:32px;margin-bottom:8px;color:var(--brd2);}

  .notif-group{padding:0 0 6px;}
  .notif-group-head{font-size:10.5px;font-weight:600;color:var(--mu);
    text-transform:uppercase;letter-spacing:.6px;padding:14px 18px 8px;}

  .notif-item{display:flex;gap:12px;padding:10px 18px;cursor:pointer;
    transition:background .12s;position:relative;}
  .notif-item:hover{background:var(--sur2);}
  .notif-item.unread{background:rgba(79,124,255,.04);}
  .notif-item.unread:hover{background:rgba(79,124,255,.08);}
  .notif-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;}
  .notif-icon svg{width:16px;height:16px;}
  .notif-icon.new_lead{background:rgba(79,124,255,.14);color:var(--ac2);}
  .notif-icon.engagement{background:rgba(34,200,138,.14);color:var(--gr);}
  .notif-icon.reminder{background:rgba(245,166,35,.14);color:var(--am);}
  .notif-icon.status_change{background:rgba(20,184,166,.14);color:#2dd4bf;}
  .notif-icon.assignment{background:rgba(167,139,250,.14);color:#c4b5fd;}
  .notif-text{flex:1;min-width:0;}
  .notif-item-title{font-size:12.5px;font-weight:500;color:var(--tx);line-height:1.35;}
  .notif-item.unread .notif-item-title{font-weight:600;}
  .notif-item-body{font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .notif-item-time{font-family:var(--mono);font-size:10.5px;color:var(--mu);margin-top:4px;}
  .notif-unread-dot{position:absolute;top:18px;right:18px;width:7px;height:7px;
    border-radius:50%;background:var(--ac);}

  .notif-footer{padding:8px;border-top:0.5px solid var(--brd);flex-shrink:0;}
  .notif-seeall{width:100%;background:transparent;border:none;color:var(--ac2);
    font-size:12.5px;font-weight:500;font-family:var(--font);cursor:pointer;
    padding:8px;border-radius:6px;transition:background .12s;}
  .notif-seeall:hover{background:rgba(79,124,255,.08);}

  /* SIDEBAR NAVIGATION */
  .sidebar{position:fixed;top:64px;left:0;width:64px;height:calc(100vh - 64px);
    background:var(--bg);border-right:0.5px solid var(--brd);
    display:flex;flex-direction:column;align-items:center;
    padding:14px 0 18px;z-index:70;}
  .sidebar-nav{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;flex:1;}
  .sidebar-nav-spacer{flex:1;}
  .sb-item{position:relative;width:40px;height:40px;display:flex;align-items:center;
    justify-content:center;border-radius:10px;cursor:pointer;color:var(--mu);
    transition:all .12s;flex-shrink:0;}
  .sb-item:hover{background:var(--hover);color:var(--tx);}
  .sb-item.active{background:var(--ac);color:#fff;}
  .sb-item.active:hover{background:var(--ac);}
  .sb-divider{width:32px;height:0.5px;background:var(--brd);margin:6px 0;flex-shrink:0;}
  .sb-item::after{content:attr(data-label);position:absolute;left:54px;top:50%;
    transform:translateY(-50%);background:var(--sur2);color:var(--ac2);
    font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;
    border:0.5px solid var(--ac);white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .12s;z-index:100;}
  .sb-item:hover::after{opacity:1;}
  .sb-account{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:600;color:#fff;
    background:var(--gr);cursor:pointer;position:relative;flex-shrink:0;margin-top:8px;}
  .sb-account::after{content:'Account';position:absolute;left:50px;top:50%;
    transform:translateY(-50%);background:var(--sur2);color:var(--ac2);
    font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;
    border:0.5px solid var(--ac);white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .12s;z-index:100;}
  .sb-account:hover::after{opacity:1;}

  /* Main content shifts right (past sidebar) and down (past header) */
  .main-area{margin-left:64px;margin-top:64px;}

  /* Page-level "Coming soon" toast */
  .nav-toast{position:fixed;top:80px;right:24px;width:340px;max-width:calc(100vw - 48px);
    background:var(--sur);border:0.5px solid var(--brd2);border-radius:12px;
    padding:14px 18px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:9000;
    transform:translateX(380px);opacity:0;pointer-events:none;
    transition:transform .25s ease-out, opacity .2s ease-out;
    display:flex;align-items:center;gap:12px;}
  .nav-toast.show{transform:translateX(0);opacity:1;pointer-events:auto;}
  .nav-toast-icon{width:32px;height:32px;border-radius:8px;background:rgba(79,124,255,.15);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ac2);}
  .nav-toast-text{flex:1;min-width:0;}
  .nav-toast-text strong{display:block;font-size:13px;font-weight:600;color:var(--tx);}
  .nav-toast-text span{font-size:12px;color:var(--mu);}
  .nav-toast-close{background:transparent;border:none;color:var(--mu);font-size:16px;
    cursor:pointer;padding:4px;line-height:1;border-radius:6px;transition:all .12s;}
  .nav-toast-close:hover{background:var(--sur2);color:var(--tx);}

  /* MOBILE DRAWER */
  .mobile-drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;}
  .mobile-drawer-backdrop.open{display:block;}
  .mobile-drawer{position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--sur);
    border-right:0.5px solid var(--brd2);z-index:200;transform:translateX(-100%);
    transition:transform .22s ease-out;display:flex;flex-direction:column;padding:18px 10px;}
  .mobile-drawer.open{transform:translateX(0);}
  .md-nav{display:flex;flex-direction:column;gap:4px;}
  .md-item{display:flex;align-items:center;gap:12px;padding:10px 14px;
    border-radius:10px;cursor:pointer;color:var(--mu);transition:all .12s;
    font-size:14px;font-weight:500;}
  .md-item:hover{background:var(--hover);color:var(--tx);}
  .md-item.active{background:var(--ac);color:#fff;}
  .md-divider{height:0.5px;background:var(--brd);margin:8px 14px;}
  .md-account{margin-top:auto;}
  .md-account-av{width:28px;height:28px;border-radius:50%;background:var(--gr);
    display:flex;align-items:center;justify-content:center;font-size:11px;
    font-weight:600;color:#fff;}
  .hamburger-btn{display:none;background:transparent;border:none;color:var(--tx);
    cursor:pointer;width:40px;height:40px;align-items:center;justify-content:center;
    border-radius:10px;transition:background .12s;flex-shrink:0;}
  .hamburger-btn:hover{background:var(--hover);}
  .th-left{display:flex;align-items:center;gap:8px;}

  /* Product switcher */
  .logo{cursor:pointer;user-select:none;}
  .logo-chev{width:14px;height:14px;color:var(--mu);transition:transform .15s;flex-shrink:0;}
  .logo.ps-open .logo-chev{transform:rotate(180deg);}
  .product-switcher{display:none;position:fixed;width:220px;background:var(--sur);
    border:0.5px solid var(--brd2);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);
    padding:6px;z-index:9999;}
  .product-switcher.ps-open{display:flex;flex-direction:column;}
  .ps-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;
    font-size:13.5px;font-weight:500;color:var(--tx);text-decoration:none;transition:background .12s;}
  .ps-item:hover{background:var(--sur2);}
  .ps-item.ps-active{background:rgba(79,124,255,.10);color:var(--ac2);}
  .ps-ic{width:18px;height:18px;flex-shrink:0;}

  /* Organization page content */
  .org-scroll{flex:1;overflow:auto;padding:20px 24px 36px;display:flex;flex-direction:column;gap:16px;}
  .org-add{margin-left:auto;}

  /* Table */
  .nm-table-wrap{border:0.5px solid var(--brd2);border-radius:12px;overflow:hidden;background:var(--sur);}
  .nm-table-scroll{overflow-x:auto;}
  .nm-table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px;}
  .nm-table th{text-align:left;font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;padding:13px 16px;background:var(--sur2);border-bottom:0.5px solid var(--brd2);white-space:nowrap;}
  .nm-table td{padding:13px 16px;border-bottom:0.5px solid var(--brd);color:var(--tx);vertical-align:middle;}
  .nm-table tbody tr:last-child td{border-bottom:none;}
  .nm-table tbody tr{cursor:pointer;}
  .nm-table tbody tr:hover{background:var(--hover);}
  .org-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;
    padding:3px 8px;border-radius:5px;white-space:nowrap;}
  .org-status.status-active{background:rgba(34,200,138,.12);color:var(--gr);}
  .org-status.status-inactive{background:rgba(232,85,85,.12);color:var(--rd);}
  .name-cell{display:flex;align-items:center;gap:8px;}
  .av{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;}
  .nm{font-weight:500;color:var(--tx2);font-size:12.5px;}
  .nm-pager{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .nm-pager-info{font-size:12.5px;color:var(--mu);}
  .nm-pager-btns{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .nm-pg{min-width:32px;height:32px;padding:0 9px;border:0.5px solid var(--brd2);background:var(--sur2);color:var(--tx);border-radius:7px;font-family:var(--font);font-size:12.5px;cursor:pointer;transition:all .15s;}
  .nm-pg:hover:not(:disabled){border-color:var(--mu);}
  .nm-pg.active{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;}
  .nm-pg:disabled{opacity:.4;cursor:not-allowed;}
  .ci{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mu);}
  .ci svg{width:12px;height:12px;flex-shrink:0;}
  .org-role{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;font-size:11px;color:var(--mu);background:var(--sur2);border:0.5px solid var(--brd);white-space:nowrap;}
  .org-role svg{width:10px;height:10px;flex-shrink:0;}
  .org-th-status{width:90px;}
  .org-th-contact{width:240px;}
  .org-th-role{width:140px;}

  /* RESPONSIVE */
  @media(max-width:640px){
    .sidebar{display:none;}
    .main-area{margin-left:0;}
    .hamburger-btn{display:flex;}
    .org-scroll{padding:14px;}
    .org-add{width:44px;padding:0;}
    .org-add svg{width:20px;height:20px;}
    .org-add .org-add-txt{display:none;}
    .nm-pager{justify-content:center;}
    .nm-pg{min-width:44px;height:44px;}
  }
</style>

<!-- TOP HEADER -->

  </div>
  <div class="top-header-right">
    <button class="header-bell" id="header-bell" data-label="Notifications" onclick="toggleNotifications(event)" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="header-bell-dot" id="header-bell-dot"></span>
      <span class="header-bell-call-dot" id="header-bell-call-dot"></span>
    </button>
  </div>
</div>

<!-- NOTIFICATIONS PANEL -->
<div class="notif-panel" id="notif-panel">
  <div class="notif-header">
    <span class="notif-title">Notifications</span>
    <div class="notif-header-actions">
      <button class="notif-markall" id="notif-markall" onclick="markAllNotificationsRead()">Mark all as read</button>
      <button class="notif-close" onclick="closeNotifications()" aria-label="Close notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="notif-tabs">
    <button class="notif-tab active" data-tab="all" onclick="setNotifTab('all')">All <span class="notif-tab-count" id="notif-count-all">0</span></button>
    <button class="notif-tab" data-tab="unread" onclick="setNotifTab('unread')">Unread <span class="notif-tab-count" id="notif-count-unread">0</span></button>
  </div>
  <div class="notif-body" id="notif-body"></div>
  <div class="notif-footer">
    <button class="notif-seeall" onclick="window.location.href='../../notification/notification.html'">See all notifications</button>
  </div>
</div>

<!-- SIDEBAR NAVIGATION -->
<div class="sidebar">
  <div class="sidebar-nav">
    <div class="sb-item" data-nav="home" data-label="Dashboard" onclick="navClick('Home')">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 13.5H15"/><path d="M9.5 13.5V9.5H6.5V13.5"/><path d="M2.5 7.29309V13.5"/><path d="M13.5 13.5V7.29309"/><path d="M1.5 8.29315L7.64625 2.14628C7.69269 2.09979 7.74783 2.06291 7.80853 2.03775C7.86923 2.01259 7.93429 1.99963 8 1.99963C8.06571 1.99963 8.13077 2.01259 8.19147 2.03775C8.25217 2.06291 8.30731 2.09979 8.35375 2.14628L14.5 8.29315"/></svg>

var NOTIF_ICONS={
  new_lead:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',

};

function _notifTime(h){
  if(h<1) return Math.round(h*60)+'m ago';
  if(h<24) return Math.round(h)+'h ago';
  if(h<48) return 'Yesterday';
  return Math.round(h/24)+'d ago';
}
function _notifGroup(h){ return h<24?'Today':h<48?'Yesterday':'Earlier'; }

function renderNotifications(filter){
  var body=document.getElementById('notif-body'); if(!body) return;
  var list=notifications.slice();
  if(filter==='unread') list=list.filter(function(n){return !n.read;});
  if(!list.length){ body.innerHTML='<div class="notif-empty"><div class="notif-empty-icon">✔</div>No notifications</div>'; return; }
  var groups={}, order=[];
  list.forEach(function(n){
    var g=_notifGroup(n.t);
    if(!groups[g]){groups[g]=[];order.push(g);}
    groups[g].push(n);
  });
  var html='';
  order.forEach(function(g){
    html+='<div class="notif-group"><div class="notif-group-head">'+g+'</div>';
    groups[g].forEach(function(n){
      html+='<div class="notif-item'+(n.read?'':' unread')+'" data-id="'+n.id+'" onclick="markNotificationRead('+n.id+')">';
      html+='<div class="notif-icon '+n.type+'">'+(NOTIF_ICONS[n.type]||'')+'</div>';
      html+='<div class="notif-text"><div class="notif-item-title">'+n.title+'</div>';
      html+='<div class="notif-item-body">'+n.body+'</div>';
      html+='<div class="notif-item-time">'+_notifTime(n.t)+'</div></div>';
      if(!n.read) html+='<div class="notif-unread-dot"></div>';
      html+='</div>';
    });
    html+='</div>';
  });
  body.innerHTML=html;
}

var _notifTab='all';
function setNotifTab(tab){
  _notifTab=tab;
  document.querySelectorAll('.notif-tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===tab);});
  renderNotifications(tab);
}
function _notifCounts(){
  var all=notifications.length, unread=notifications.filter(function(n){return !n.read;}).length;
  var ce=document.getElementById('notif-count-all'); if(ce) ce.textContent=all;
  var cu=document.getElementById('notif-count-unread'); if(cu) cu.textContent=unread;
  var dot=document.getElementById('header-bell-dot'); if(dot) dot.classList.toggle('show',unread>0);
  var ma=document.getElementById('notif-markall'); if(ma) ma.disabled=unread===0;
}
function markNotificationRead(id){
  notifications.forEach(function(n){if(n.id===id) n.read=true;});
  _notifCounts(); renderNotifications(_notifTab);
}
function markAllNotificationsRead(){
  notifications.forEach(function(n){n.read=true;});
  _notifCounts(); renderNotifications(_notifTab);
}
function toggleNotifications(e){
  if(e) e.stopPropagation();
  var panel=document.getElementById('notif-panel');
  var bell=document.getElementById('header-bell');
  if(!panel) return;
  var open=panel.classList.contains('open');
  if(open){ closeNotifications(); return; }
  var r=bell.getBoundingClientRect();
  panel.style.top=(r.bottom+8)+'px';
  panel.style.left=Math.min(r.right-420+20, window.innerWidth-430)+'px';
  if(window.innerWidth<=640){panel.style.left='50%';panel.style.transform='translateX(-50%)';panel.style.width='calc(100vw - 32px)';}
  else{panel.style.transform='';panel.style.width='';}
  panel.classList.add('open');
  bell.classList.add('active');
  _notifCounts(); renderNotifications(_notifTab);
}
function closeNotifications(){
  var panel=document.getElementById('notif-panel');
  var bell=document.getElementById('header-bell');
  if(panel) panel.classList.remove('open');
  if(bell) bell.classList.remove('active');
}
document.addEventListener('mousedown',function(e){
  var panel=document.getElementById('notif-panel');
  if(!panel||!panel.classList.contains('open')) return;
  if(e.target.closest && (e.target.closest('#notif-panel')||e.target.closest('#header-bell'))) return;
  closeNotifications();
});

}

<script>
(function(){
  function portalSwitcher(){
    var ps=document.getElementById('product-switcher');
    if(ps && ps.parentElement !== document.body) document.body.appendChild(ps);
  }
  function positionSwitcher(){
    var logo=document.querySelector('.logo'); var ps=document.getElementById('product-switcher');
    if(!logo||!ps) return;
    var r=logo.getBoundingClientRect();
    ps.style.left=((window.innerWidth>640) ? 66 : r.left)+'px';
    ps.style.top=(r.bottom+8)+'px';
  }
  function toggleProductSwitcher(e){
    if(e){ e.stopPropagation(); }
    var logo=document.querySelector('.logo'); var ps=document.getElementById('product-switcher'); if(!logo||!ps) return;
    portalSwitcher();
    var willOpen=!ps.classList.contains('ps-open');
    if(willOpen) positionSwitcher();
    ps.classList.toggle('ps-open', willOpen); logo.classList.toggle('ps-open', willOpen);
  }
  function closeProductSwitcher(){
    var logo=document.querySelector('.logo'); var ps=document.getElementById('product-switcher');
    if(logo) logo.classList.remove('ps-open'); if(ps) ps.classList.remove('ps-open');
  }
  window.toggleProductSwitcher=toggleProductSwitcher;
  window.closeProductSwitcher=closeProductSwitcher;
  function init(){
    portalSwitcher();
    var isRep = location.pathname.replace(/\\/g,'/').indexOf('/reputation/')>=0;
    document.querySelectorAll('.ps-item').forEach(function(a){
      var pid=a.getAttribute('data-pid');
      var active=(isRep && pid==='reputation') || (!isRep && pid==='coreconnect');
      a.classList.toggle('ps-active', active);
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  document.addEventListener('mousedown', function(e){
    var ps=document.getElementById('product-switcher'); if(!ps||!ps.classList.contains('ps-open')) return;
    if(e.target.closest && (e.target.closest('.logo')||e.target.closest('#product-switcher'))) return;
    closeProductSwitcher();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeProductSwitcher(); });
  window.addEventListener('resize', function(){ var ps=document.getElementById('product-switcher'); if(ps && ps.classList.contains('ps-open')) positionSwitcher(); });
  window.addEventListener('scroll', function(){ var ps=document.getElementById('product-switcher'); if(ps && ps.classList.contains('ps-open')) positionSwitcher(); }, true);
})();
</script>
